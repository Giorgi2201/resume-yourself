services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_automation}
      POSTGRES_USER: ${POSTGRES_USER:-resume_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_user} -d ${POSTGRES_DB:-resume_automation}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ASP.NET Core API ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./Resume.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connection string — auto-selects PostgreSQL because it contains "Host="
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-resume_automation};
        Username=${POSTGRES_USER:-resume_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # JWT
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required (minimum 32 characters)}
      Jwt__Issuer: Resume.Api
      Jwt__Audience: Resume.Frontend
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-15}
      Jwt__RefreshTokenExpiryDays: ${JWT_REFRESH_EXPIRY_DAYS:-14}
      # CORS — frontend origin (nginx is same-origin but set for safety)
      Cors__AllowedOrigins__0: http://localhost
      Cors__AllowedOrigins__1: ${FRONTEND_ORIGIN:-http://localhost}
      # Email (optional — leave blank to use console logging in dev)
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUser: ${SMTP_USER:-}
      Email__SmtpPassword: ${SMTP_PASSWORD:-}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-noreply@example.com}
      Email__FromName: ${SMTP_FROM_NAME:-Resume Automation}
      Email__AppBaseUrl: ${APP_BASE_URL:-http://localhost}
      # Initial admin seed (set Enabled=true on first run to create an admin account)
      InitialAdmin__Enabled: ${INITIAL_ADMIN_ENABLED:-false}
      InitialAdmin__Email: ${INITIAL_ADMIN_EMAIL:-}
      InitialAdmin__Password: ${INITIAL_ADMIN_PASSWORD:-}
      InitialAdmin__Role: Admin

  # ── Angular frontend (nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  db_data:
