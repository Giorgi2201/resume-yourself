<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <p class="eyebrow">Resume Automation</p>
      <h1>Sign in</h1>
      <p class="sub">Use your team account to manage screenings and results.</p>
    </div>

    @if (resendSuccess()) {
      <div class="alert alert--success" role="status">
        Verification email sent — check your inbox.
      </div>
    }

    @if (errorMessage()) {
      <div class="alert" role="alert">{{ errorMessage() }}</div>
    }

    @if (showResend()) {
      <button
        class="resend-btn"
        (click)="resendVerification()"
        [disabled]="resendLoading()"
      >
        {{ resendLoading() ? 'Sending…' : 'Resend verification email' }}
      </button>
    }

    <form (ngSubmit)="submit()" class="form" novalidate>
      <label class="field">
        <span>Work email</span>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="username"
          required
          placeholder="you@company.com"
        />
      </label>
      <label class="field">
        <span>Password</span>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
          placeholder="••••••••"
        />
      </label>
      <button type="submit" class="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Continue' }}
      </button>
    </form>

    <div class="footer-links">
      <p class="footer">
        <a routerLink="/register" class="link">Create an account</a>
      </p>
      <p class="footer">
        <a routerLink="/" class="link">← Back to home</a>
      </p>
    </div>
  </div>
</div>
