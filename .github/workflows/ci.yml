name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  # ── Backend: restore → build → test ────────────────────────────────────────
  backend-ci:
    name: Backend CI (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: |
          dotnet restore Resume.Api/Resume.Api.csproj
          dotnet restore Resume.Api.Tests/Resume.Api.Tests.csproj

      - name: Build (Release)
        run: |
          dotnet build Resume.Api/Resume.Api.csproj --no-restore --configuration Release
          dotnet build Resume.Api.Tests/Resume.Api.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test Resume.Api.Tests/Resume.Api.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./test-results/*.trx

  # ── Frontend: install → build (production) → archive dist ──────────────────
  frontend-ci:
    name: Frontend CI (Angular / Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/resume-automation/browser/
